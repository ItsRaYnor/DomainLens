<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The tab icon. Fixed colours rather than tokens: a favicon is fetched
       as a standalone document and never sees the page's CSS. -->
  <rect width="64" height="64" rx="14" fill="#1d4ed8"/>
  <circle cx="28" cy="28" r="13" fill="none" stroke="#ffffff" stroke-width="5"/>
  <line x1="38" y1="38" x2="50" y2="50" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>
