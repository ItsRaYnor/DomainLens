<!DOCTYPE html>
<html lang="{{ locale }}"{{ theme_attr }}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('lookup.imp_title') }} — {{ general.app_title or 'DomainLens' }}</title>
    <link rel="icon" href="/static/favicon.svg?v={{ asset_token }}" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ asset_token }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_token }}">
</head>
<body>
    {% include "partials/nav.html" %}
    <main id="main">
        <section class="card">
            <h2 data-i18n="lookup.imp_title">{{ t('lookup.imp_title') }}</h2>
            <p class="ct-desc" data-i18n="lookup.imp_intro">{{ t('lookup.imp_intro') }}</p>
            <div class="lookup-form">
                <label class="lookup-field">
                    <span data-i18n="lookup.imp_domain">{{ t('lookup.imp_domain') }}</span>
                    <input type="text" id="impDomain" placeholder="examp1e.com" autocomplete="off" spellcheck="false">
                </label>
                <label class="lookup-field">
                    <span data-i18n="lookup.imp_protected">{{ t('lookup.imp_protected') }}</span>
                    <input type="text" id="impProtected" placeholder="example.com" autocomplete="off" spellcheck="false">
                </label>
                <button class="btn-primary-lite" id="impBtn" type="button" data-i18n="lookup.imp_submit">{{ t('lookup.imp_submit') }}</button>
            </div>
        </section>
        <div id="impResult"></div>
    </main>
    <div id="errorToast" class="toast hidden"></div>
    {% include "partials/footer.html" %}
    <script src="/static/js/i18n.js?v={{ asset_token }}"></script>
    {# Data block, not executable script — the CSP blocks inline <script>. #}
    <script type="application/json" id="pageLocale">{{ locale|tojson }}</script>
    <script src="/static/js/lookup.js?v={{ asset_token }}"></script>
    <script src="/static/js/theme.js?v={{ asset_token }}"></script>
</body>
</html>
