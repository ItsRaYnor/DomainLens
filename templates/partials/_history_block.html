        <aside id="historyDrawer" class="{{ 'page-panel' if as_page else 'drawer hidden' }}">
            <div class="drawer-header">
                <h3>Scan History</h3>
                <div class="drawer-actions">
                    <button class="btn-icon-sm" id="historyClearBtn" title="Clear all history">Clear</button>
                    <button class="btn-icon-sm" id="historyCloseBtn" title="Close">&times;</button>
                </div>
            </div>
            <div class="drawer-stats" id="historyStats"></div>
            <div id="historyCompareBar" class="history-compare-bar hidden">
                <span id="historyCompareHint"></span>
                <button class="btn-icon-sm" id="historyCompareRun" disabled>Compare</button>
                <button class="btn-icon-sm" id="historyCompareClear">Clear</button>
            </div>
            <div id="historyCompareResult" class="history-compare-result hidden"></div>
            <div class="drawer-body" id="historyList"></div>
        </aside>
