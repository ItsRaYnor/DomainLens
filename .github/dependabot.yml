# Updates for what DomainLens is built from, as pull requests: each one runs
# the tests, the dependency audit and the image scan before it can be merged.
#
#   pip            requirements.in, with the hashed lock (requirements.txt)
#                  regenerated by pip-compile in the same pull request
#   docker         the base image in the Dockerfile
#   github-actions the actions the workflows use
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Flask's own packages move together; one pull request, not five.
      flask:
        patterns: ["flask", "werkzeug", "jinja2", "itsdangerous", "click", "blinker", "markupsafe"]
      crypto:
        patterns: ["cryptography", "pyopenssl", "cffi", "pycparser"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The image runs Python 3.12; a move to another interpreter is a change
      # of its own, tested on purpose, not a weekly bump.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
