name: Clean up old Docker Hub tags

# Manual-only: never runs automatically, so it can't accidentally delete
# anything on a schedule or push. Run it once from the Actions tab whenever
# stale sha-<hash> tags (from before docker-publish.yml stopped creating
# them) need clearing out.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list what would be deleted, delete nothing)"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale sha-* tags from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REPO="domainlens"

          # Docker Hub's v2 API needs a short-lived JWT, obtained via the
          # username + access token (same credentials as docker/login-action).
          TOKEN=$(curl -sS -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")

          PAGE_URL="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/tags/?page_size=100"
          DELETED=0
          KEPT=0

          while [ -n "$PAGE_URL" ] && [ "$PAGE_URL" != "null" ]; do
            RESPONSE=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "$PAGE_URL")
            NAMES=$(echo "$RESPONSE" | python3 -c "import sys, json; [print(r['name']) for r in json.load(sys.stdin)['results']]")

            while IFS= read -r NAME; do
              [ -z "$NAME" ] && continue
              case "$NAME" in
                sha-*)
                  if [ "${DRY_RUN}" = "true" ]; then
                    echo "[dry run] would delete tag: $NAME"
                  else
                    echo "deleting tag: $NAME"
                    curl -sS -X DELETE \
                      -H "Authorization: Bearer ${TOKEN}" \
                      "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/tags/${NAME}/"
                  fi
                  DELETED=$((DELETED + 1))
                  ;;
                *)
                  echo "keeping tag: $NAME"
                  KEPT=$((KEPT + 1))
                  ;;
              esac
            done <<< "$NAMES"

            PAGE_URL=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('next') or '')")
          done

          echo ""
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run complete: $DELETED tag(s) would be deleted, $KEPT tag(s) kept (latest / version tags)."
            echo "Re-run with dry_run=false to actually delete them."
          else
            echo "Done: $DELETED tag(s) deleted, $KEPT tag(s) kept (latest / version tags)."
          fi
