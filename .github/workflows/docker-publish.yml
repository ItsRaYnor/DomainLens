name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  # Nothing is published unless the test suite and the dependency audit pass.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the release step below creates the tag that the
      # in-app update check compares against.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # A published version is never built again. A push to main that does
      # not raise VERSION (a Dependabot merge, a docs fix) pushed a new image
      # under the old number, so `domainlens:0.1.20` would no longer be what
      # was released as 0.1.20, and a rollback to it would land elsewhere.
      # Such a push publishes nothing; raise VERSION to release it.
      - name: Is this version published already
        id: published
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1 \
              || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is published already; nothing is built or pushed. Raise VERSION to release this commit."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.published.outputs.done != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.published.outputs.done != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Deliberately no per-commit "sha-<hash>" tag here: it would create a
      # new, never-cleaned-up Docker Hub tag on every push to main. The exact
      # commit stays fully traceable via the OCI
      # org.opencontainers.image.revision label baked into every image
      # (docker inspect itsraynor/domainlens:latest) — no tag sprawl needed.
      - name: Compute image tags
        id: meta
        if: steps.published.outputs.done != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/domainlens
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        if: steps.published.outputs.done != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOMAINLENS_VERSION=${{ steps.version.outputs.version }}
            DOMAINLENS_GIT_SHA=${{ github.sha }}
            DOMAINLENS_BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and build provenance travel with the image, so a customer's
          # own tooling (docker scout, grype, trivy) can check what is inside
          # without pulling it apart.
          sbom: true
          provenance: mode=max

      # Registry push needs write; the repo-description API needs read/write/delete
      # on the PAT (Docker Hub treats that as admin). A write-only token pushes fine
      # then fails here with Forbidden.
      - name: Update Docker Hub description
        if: steps.published.outputs.done != 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/domainlens
          short-description: "Domain Intelligence Toolkit for quick domain security analysis and vulnerability scanning."
          readme-filepath: ./docs/DOCKERHUB_README.md

      # The update check in the app reads GitHub releases (falling back to
      # tags). Creating those by hand was a step nobody remembered, which is
      # why 0.0.1 and 0.0.2 shipped without one and the check had nothing to
      # compare against for months.
      #
      # No second build results from this: GitHub deliberately does not start
      # a workflow run for a ref pushed with GITHUB_TOKEN, so the tag trigger
      # above stays available for a hand-pushed tag without firing here.
      - name: Tag and release this version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Idempotent on purpose: pushes to main that do not bump VERSION are
          # normal, and re-releasing an existing version would either fail the
          # build or quietly move a published tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # What changed, in words, from docs/releases/<version>.md when it is
          # there; GitHub's generated notes (the compare link) follow it.
          notes=()
          if [ -f "docs/releases/${VERSION}.md" ]; then
            notes=(--notes-file "docs/releases/${VERSION}.md")
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists without a release; creating the release only."
            gh release create "$tag" --title "DomainLens ${VERSION}" "${notes[@]}" --generate-notes
            exit 0
          fi
          gh release create "$tag" --target "${GITHUB_SHA}" --title "DomainLens ${VERSION}" "${notes[@]}" --generate-notes
