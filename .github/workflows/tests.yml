name: Tests

# Runs on every pull request and branch push, and is called by
# docker-publish.yml before anything is built. An image used to be published
# to `latest` without a single test having run, so a broken commit on main
# reached everyone who pulls `latest` before anyone noticed.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The image runs python:3.12; test on the same interpreter.
          python-version: "3.12"
          cache: pip

      - name: Install system tools the checks shell out to
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg

      # The lock first, hash-checked as the image installs it; pytest apart,
      # since a hash-checked install refuses anything without a hash.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A security scanner that ships a known-vulnerable dependency is the
      # first thing a customer's own scanner will flag.
      # The lock holds every package the image gets, transitive ones
      # included, so this audits all of them and not just the direct ones.
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --require-hashes --strict

      - name: The lock matches requirements.in
        run: |
          python -m pip install pip-tools
          cp requirements.txt /tmp/requirements.lock
          pip-compile -q --generate-hashes --strip-extras --allow-unsafe -o /tmp/requirements.lock requirements.in
          diff <(grep -E '^[A-Za-z0-9_.-]+==' requirements.txt) <(grep -E '^[A-Za-z0-9_.-]+==' /tmp/requirements.lock) \
            || { echo "requirements.txt is not what requirements.in compiles to; regenerate it (see requirements.in)."; exit 1; }

      # The container image rather than a pinned action version: the image
      # tag is the scanner release, with nothing in between to go stale.
      # tests/ is skipped because the secret-detection tests carry fake keys
      # on purpose.
      # The repository scan below sees requirements.txt, not what the image
      # carries besides it: the Debian packages of the base image (openssl,
      # curl, gnupg, ...) and the interpreter. The image as built is scanned
      # too, before anything is published.
      - name: Build the image
        run: docker build -t domainlens:ci .

      - name: Scan the image for vulnerable packages
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 domainlens:ci

      - name: Scan the repository for vulnerable packages and committed secrets
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:latest fs \
            --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --skip-dirs /src/tests /src
